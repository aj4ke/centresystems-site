<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>projects - centresystems.info</title>
<script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

<header>
  <a class="site" href="index.html">centresystems</a>
  <nav>
    <a href="index.html">home</a>
    <a class="cur" href="projects.html">projects</a>
    <a href="resume.html">resume</a>
    <button id="theme" type="button">dark</button>
  </nav>
</header>

<main id="main"><p class="msg">loading...</p></main>

</div>
<script src="assets/marked.js"></script>
<script src="assets/purify.js"></script>
<script src="assets/highlight.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  var main = document.getElementById('main');
  var repo = new URLSearchParams(location.search).get('r');

  function fail(text) { main.replaceChildren(el('p', { class: 'msg' }, text)); }

  function meta(r) {
    var bits = [];
    if (r.language) bits.push(r.language);
    bits.push('updated ' + shortDate(r.pushed));
    if (r.stars) bits.push(r.stars + (r.stars === 1 ? ' star' : ' stars'));
    return bits.join(' · ');
  }

  function showList() {
    fetch('/api/repos')
      .then(function (res) { if (!res.ok) throw 0; return res.json(); })
      .then(function (data) {
        var frag = document.createDocumentFragment();
        frag.appendChild(el('h2', { class: 'label' }, 'Projects'));
        if (!data.repos.length) { frag.appendChild(el('p', { class: 'msg' }, 'Nothing here yet.')); }
        var ul = el('ul', { class: 'list repos' });
        data.repos.forEach(function (r) {
          var li = el('li');
          li.appendChild(el('a', { href: 'projects.html?r=' + encodeURIComponent(r.name) }, r.name));
          var d = el('span', { class: 'd' }, r.description || '');
          d.appendChild(el('span', { class: 'meta' }, meta(r)));
          li.appendChild(d);
          ul.appendChild(li);
        });
        if (data.repos.length) frag.appendChild(ul);
        var gh = el('a', { class: 'more', href: 'https://github.com/' + data.user }, 'github.com/' + data.user);
        frag.appendChild(gh);
        main.replaceChildren(frag);
      })
      .catch(function () { fail('Could not load projects.'); });
  }

  // GitHub-style bordered box with a header row
  function box(head, body) {
    var h = el('div', { class: 'box-head' });
    h.append.apply(h, head);
    var b = el('div', { class: 'box' });
    b.append(h, body);
    return b;
  }

  // syntax highlight a <code>: by language name if highlight.js knows it, else let it guess
  function hl(code, lang) {
    var t = code.textContent;
    code.innerHTML = (hljs.getLanguage(lang) ? hljs.highlight(t, { language: lang }) : hljs.highlightAuto(t)).value;
  }
  function hlBlocks(root) {
    root.querySelectorAll('pre code').forEach(function (c) { hl(c, (c.className.match(/language-(\S+)/) || [])[1]); });
  }

  function showRepo(name) {
    fetch('/api/readme/' + encodeURIComponent(name))
      .then(function (res) {
        if (res.status === 404) throw new Error('missing');
        if (!res.ok) throw 0;
        return res.json();
      })
      .then(function (data) {
        var r = data.repo;
        var path = new URLSearchParams(location.search).get('p') || '';
        var base = 'projects.html?r=' + encodeURIComponent(r.name);
        var raw = 'https://raw.githubusercontent.com/' + data.user + '/' + r.name + '/HEAD/';
        var blob = 'https://github.com/' + data.user + '/' + r.name + '/blob/HEAD/';
        var resolve = function (u, kind) { return (kind === 'img' ? raw : blob) + u.replace(/^\.?\//, ''); };
        document.title = r.name + ' - centresystems.info';
        var frag = document.createDocumentFragment();
        frag.appendChild(el('a', { class: 'back', href: 'projects.html' }, '← projects'));
        frag.appendChild(el('h1', { class: 'title' }, r.name));
        var pm = el('p', { class: 'pagemeta' });
        pm.appendChild(el('a', { href: r.url }, 'view on github'));
        pm.appendChild(document.createTextNode(' · ' + meta(r)));
        frag.appendChild(pm);

        // breadcrumb header: repo / dir / file
        var crumbs = [el('a', { href: base }, r.name)], acc = '';
        path.split('/').filter(Boolean).forEach(function (part) {
          acc += (acc ? '/' : '') + part;
          crumbs.push(' / ', el('a', { href: base + '&p=' + encodeURIComponent(acc) }, part));
        });

        var isDir = !path || data.files.some(function (f) { return f.dir && f.path === path; });
        if (isDir) {
          var prefix = path ? path + '/' : '';
          var ul = el('ul', { class: 'tree' });
          data.files
            .filter(function (f) { return f.path.startsWith(prefix) && f.path.indexOf('/', prefix.length) < 0; })
            .sort(function (a, b) { return b.dir - a.dir || a.path.localeCompare(b.path); })
            .forEach(function (f) {
              var li = el('li', { class: f.dir ? 'dir' : 'file' });
              li.appendChild(el('a', { href: base + '&p=' + encodeURIComponent(f.path) }, f.path.slice(prefix.length)));
              ul.appendChild(li);
            });
          frag.appendChild(box(crumbs, ul));
          if (!path) {
            var article = el('article', { class: 'md' });
            if (data.markdown) { renderMarkdown(article, data.markdown, resolve); hlBlocks(article); }
            else article.appendChild(el('p', {}, r.description || 'No README yet.'));
            frag.appendChild(box(['README'], article));
          }
        } else {
          var view = el('div');
          frag.appendChild(box(crumbs, view));
          if (/\.(png|jpe?g|gif|svg|webp|ico)$/i.test(path)) view.appendChild(el('img', { src: raw + encodeURI(path) }));
          else fetch(raw + encodeURI(path)).then(function (res) { return res.text(); }).then(function (t) {
            if (/\.md$/i.test(path)) { view.className = 'md'; renderMarkdown(view, t, resolve); hlBlocks(view); }
            else if (t.indexOf('\0') >= 0) view.textContent = 'Binary file.';
            else hl(view.appendChild(el('pre', { class: 'src' })).appendChild(el('code', null, t)), path.split('.').pop());
          });
        }
        main.replaceChildren(frag);
      })
      .catch(function (e) {
        fail(e && e.message === 'missing' ? 'No project called "' + name + '".' : 'Could not load this project.');
      });
  }

  if (repo) showRepo(repo); else showList();
})();
</script>
</body>
</html>
